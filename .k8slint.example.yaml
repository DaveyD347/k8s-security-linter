# Copy to .k8slint.yaml in your repository root. Every key is optional.

# Rules to turn off everywhere.
skip-rules:
  - KSL010   # missing resource requests
  - KSL011   # read-only root filesystem

# Run only these rules (omit to run all).
# rules: [KSL001, KSL003, KSL101]

# Glob patterns (relative to the repo root) that are never scanned.
exclude:
  - "tests/fixtures/*"
  - "vendor/*"

# Change the severity of a rule to fit your policy.
severity:
  KSL012: high   # treat unpinned images as high

# Helm rendering.
helm: true
helm-values:
  - charts/app/values-prod.yaml
