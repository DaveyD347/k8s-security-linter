[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-security-linter"
version = "1.0.0"
description = "Security linter for Kubernetes manifests and Helm charts, mapped to the CIS Kubernetes Benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
keywords = ["kubernetes", "helm", "security", "linter", "github-action", "cis-benchmark", "rbac"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
k8slint = "k8slint.cli:main"

[project.urls]
Homepage = "https://github.com/DaveyD347/k8s-security-linter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
